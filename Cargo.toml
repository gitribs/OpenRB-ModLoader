[package]
name = "orb-modloader"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "TR-808 and TR-909 wrapper around orb-engine, for the OpenRB Modloader plugin"

[lib]
name = "orb_modloader"
crate-type = ["staticlib", "rlib"]

[dependencies]
orb-engine = { path = "third_party/openrb-338/crates/orb-engine" }
rbm = { path = "third_party/openrb-338/crates/rbm" }

[profile.release]
panic = "abort"
